[package]
name = "core-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
aws-sdk-s3 = { version = "1.149.0", features = ["behavior-version-latest"] }
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
governor = { version = "0.10", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.10.3"
rpassword = "7.5.4"
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "rust_decimal", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tower-sessions = "0.15.0"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4"] }
