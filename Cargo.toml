[package]
name = "core-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "rust_decimal", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
